name: KPM Symbol Lookup Test

on:
  workflow_dispatch:
  push:
    branches:
      - sukisu-nova-kpm
    paths:
      - "kpm-tests/**"
      - ".github/workflows/KPM Symbol Lookup Test.yml"

permissions:
  contents: read

jobs:
  build-kpm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sukisu-Nova
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl make xz-utils

      - name: Fetch pinned SukiSU KernelPatch sources
        run: |
          set -euo pipefail
          git clone https://github.com/SukiSU-Nova/SukiSU_KernelPatch_patch.git KernelPatch
          git -C KernelPatch checkout --detach 1c5b608916357ac86a94cc736e235db1fac4a29d
          test "$(git -C KernelPatch rev-parse HEAD)" = "1c5b608916357ac86a94cc736e235db1fac4a29d"

      - name: Install ARM64 bare-metal toolchain
        run: |
          set -euo pipefail
          archive="arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz"
          curl -fL --retry 3 --retry-delay 2 -o "$archive" "https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/$archive"
          tar -Jxf "$archive"
          echo "$GITHUB_WORKSPACE/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin" >> "$GITHUB_PATH"

      - name: Build read-only symbol lookup KPM
        run: |
          set -euo pipefail
          export TARGET_COMPILE=aarch64-none-elf-
          make -C kpm-tests KP_DIR="$GITHUB_WORKSPACE/KernelPatch"
          test -s kpm-tests/kpm-symbol-lookup-test.kpm
          file kpm-tests/kpm-symbol-lookup-test.kpm
          readelf -h kpm-tests/kpm-symbol-lookup-test.kpm

      - name: Upload KPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpm-symbol-lookup-test
          path: kpm-tests/kpm-symbol-lookup-test.kpm
          if-no-files-found: error
